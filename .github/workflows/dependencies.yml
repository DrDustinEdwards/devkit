name: dependencies

# Known vulnerabilities in the caller's dependencies, found by OSV-Scanner in every lockfile in the repository, nested ones
# such as mcp/package-lock.json included. On a pull request (or a merge queue entry) it scans the base commit too and fails
# only on a vulnerability the change adds, so a repository with old advisories can still merge; on any other event (a
# push, a schedule) it lists every known vulnerability as a warning and in the job summary without failing, because
# Renovate and GitHub's own alerts carry those fixes and a red run on every push mailed the owner for advisories no change
# of theirs added. This is OSV-Scanner's documented pull request mode (google.github.io/osv-scanner/github-action)
# run with the binary below; GitHub's dependency review does the same job but needs the dependency graph turned on, and paid
# Code Security in a private repository.
#
# Exceptions, each with its reason, go in an osv-scanner.toml at the repository root (`[[IgnoredVulns]]` with `id`, `reason`
# and an `ignoreUntil` date), which applies it to every lockfile.
#
# A CALLER (examples/dependencies-caller.yml) pins a full 40-character sha; scripts/check-callers.mjs fails on anything else.

on:
  workflow_call:
    inputs:
      timeout-minutes:
        required: false
        type: number
        default: 10

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # An empty ref checks out devkit's default branch, so the caller's pin would mean nothing.
      - name: Know the commit the caller pinned
        env:
          PINNED: ${{ job.workflow_sha }}
        run: test -n "$PINNED" || { echo "::error::job.workflow_sha is empty, so devkit cannot be read at the caller's pin."; exit 1; }

      # The steps are composite actions in devkit at that commit (.github/actions/), the one copy pr.yml runs too.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: DrDustinEdwards/devkit
          ref: ${{ job.workflow_sha }}
          path: .devkit
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: head
          persist-credentials: false

      - uses: ./.devkit/.github/actions/osv-scanner
        with:
          path: head
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
