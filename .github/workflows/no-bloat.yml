name: no-bloat

# Knip, jscpd and the test count against the repository's committed baseline (.no-bloat.json), with the comment share as a
# warning. A count above its baseline fails the job; a count that went down passes and says how to lower the baseline. On a
# pull request the job summary also has the lines it adds and removes (code, tests, comments, docs, other); nothing is posted.
# The work is the package's bin, bin/no-bloat.mjs, so the same check runs locally with `npx devkit-no-bloat`; this file only
# checks out, installs and calls it.
#
# THE BIN COMES FROM THE CALLER'S OWN INSTALL: the caller lists "@dustinedwards/devkit" in its devDependencies at a tag.
#
# MINUTES. A called workflow bills the caller. Public repositories call it on pull_request and on push to the default
# branch; private ones on a weekly schedule.
#
# A CALLER (examples/no-bloat-caller.yml) pins a full 40-character sha; scripts/check-callers.mjs fails on anything else.

on:
  workflow_call:
    inputs:
      node-version-file:
        description: The file naming the Node version, as actions/setup-node reads it.
        required: false
        type: string
        default: .nvmrc
      package-manager:
        description: npm or pnpm. pnpm is set up from the caller's packageManager field, and its store is cached.
        required: false
        type: string
        default: npm
      install:
        description: The install command. It must install @dustinedwards/devkit. Empty for `npm ci` or `pnpm install --frozen-lockfile`.
        required: false
        type: string
        default: ""
      prepare:
        description: Run after the install and before the check, for generated files the code imports. Empty for none.
        required: false
        type: string
        default: ""
      config:
        description: The no-bloat config, with the runs and the baseline (see bin/no-bloat.mjs).
        required: false
        type: string
        default: .no-bloat.json
      warn-only:
        description: Report only. Growth and a tool that cannot run are warnings and the job passes (devkit-no-bloat --warn-only).
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  report:
    name: No-bloat ratchet
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # An empty ref checks out devkit's default branch, so the caller's pin would mean nothing.
      - name: Know the commit the caller pinned
        env:
          PINNED: ${{ job.workflow_sha }}
        run: test -n "$PINNED" || { echo "::error::job.workflow_sha is empty, so devkit cannot be read at the caller's pin."; exit 1; }

      # The steps are composite actions in devkit at that commit (.github/actions/), the one copy pr.yml runs too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DrDustinEdwards/devkit
          ref: ${{ job.workflow_sha }}
          path: .devkit
          persist-credentials: false

      # A pull request checks out its merge commit; its first parent is the base the lines are counted against. The
      # caller's files sit in repo/, beside .devkit, so no tool reads devkit's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      - uses: ./.devkit/.github/actions/setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager: ${{ inputs.package-manager }}
          install: ${{ inputs.install }}

      - uses: ./.devkit/.github/actions/no-bloat
        with:
          prepare: ${{ inputs.prepare }}
          config: ${{ inputs.config }}
          warn-only: ${{ inputs.warn-only }}
