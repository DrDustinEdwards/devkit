name: no-bloat

# Knip and jscpd against the repository's committed baseline (.no-bloat.json). A count above its baseline fails the job; a
# count that went down passes and says how to lower the baseline. The work is the package's bin, bin/no-bloat.mjs, so the
# same check runs locally with `npx devkit-no-bloat`; this file only checks out, installs and calls it.
#
# THE BIN COMES FROM THE CALLER'S OWN INSTALL: the caller lists "@dustinedwards/devkit" in its devDependencies at a tag.
#
# MINUTES. A called workflow bills the caller. Public repositories call it on pull_request and on push to the default
# branch; private ones on a weekly schedule.
#
# A CALLER (examples/no-bloat-caller.yml) pins a full 40-character sha; scripts/check-callers.mjs fails on anything else.

on:
  workflow_call:
    inputs:
      node-version-file:
        description: The file naming the Node version, as actions/setup-node reads it.
        required: false
        type: string
        default: .nvmrc
      install:
        description: The install command. It must install @dustinedwards/devkit.
        required: false
        type: string
        default: npm ci
      prepare:
        description: Run after the install and before the check, for generated files the code imports. Empty for none.
        required: false
        type: string
        default: ""
      config:
        description: The no-bloat config, with the runs and the baseline (see bin/no-bloat.mjs).
        required: false
        type: string
        default: .no-bloat.json
      timeout-minutes:
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  report:
    name: No-bloat ratchet
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "$INSTALL"

      - name: Prepare
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: bash -euo pipefail -c "$PREPARE"

      - name: Check
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          bin=node_modules/@dustinedwards/devkit/bin/no-bloat.mjs
          if [ ! -f "$bin" ]; then
            echo "::error::@dustinedwards/devkit is not installed. Add it to devDependencies at a tag (see the devkit README)."
            exit 1
          fi
          node "$bin" --config "$CONFIG"
