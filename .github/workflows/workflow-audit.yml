name: workflow-audit

# The caller's GitHub Actions, through actionlint (with shellcheck on every run: script) and zizmor (the security audits, at
# its default persona). Any finding fails, each one an annotation on its line. Every tool is a release file at an exact
# version, checked against its sha256 before it runs; to move one, change its version and checksum together.
#
# Exceptions are the tools' own config files in the caller, each with its reason in a comment: .github/actionlint.yaml
# (`paths: <glob>: ignore: [<message regex>]`) and .github/zizmor.yml (`rules: <audit>: ignore: [<file>:<line>]`), or a
# `# zizmor: ignore[<audit>]` comment on the line.
#
# A CALLER (examples/workflow-audit-caller.yml) pins a full 40-character sha; scripts/check-callers.mjs fails on anything else.

on:
  workflow_call:
    inputs:
      min-severity:
        description: The lowest zizmor severity that fails (informational, low, medium or high).
        required: false
        type: string
        default: medium
      timeout-minutes:
        required: false
        type: number
        default: 10

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # An empty ref checks out devkit's default branch, so the caller's pin would mean nothing.
      - name: Know the commit the caller pinned
        env:
          PINNED: ${{ job.workflow_sha }}
        run: test -n "$PINNED" || { echo "::error::job.workflow_sha is empty, so devkit cannot be read at the caller's pin."; exit 1; }

      # The steps are composite actions in devkit at that commit (.github/actions/), the one copy pr.yml runs too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DrDustinEdwards/devkit
          ref: ${{ job.workflow_sha }}
          path: .devkit
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - uses: ./.devkit/.github/actions/workflow-audit
        with:
          zizmor: "false"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # An empty ref checks out devkit's default branch, so the caller's pin would mean nothing.
      - name: Know the commit the caller pinned
        env:
          PINNED: ${{ job.workflow_sha }}
        run: test -n "$PINNED" || { echo "::error::job.workflow_sha is empty, so devkit cannot be read at the caller's pin."; exit 1; }

      # The steps are composite actions in devkit at that commit (.github/actions/), the one copy pr.yml runs too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DrDustinEdwards/devkit
          ref: ${{ job.workflow_sha }}
          path: .devkit
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - uses: ./.devkit/.github/actions/workflow-audit
        with:
          actionlint: "false"
          min-severity: ${{ inputs.min-severity }}
