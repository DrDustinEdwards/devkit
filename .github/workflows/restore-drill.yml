name: restore-drill

# THE WEEKLY RESTORE DRILL of a site's nightly D1 dump. A backup is proven by restoring it: d1-dump downloads the newest
# complete run from the site's backups bucket through the R2 REST API, restores it into a scratch SQLite file and checks
# the copy (d1-dump README, "Restore drill"). Every site with a D1 database calls this weekly; devkit-ops-audit's R1 reads
# the caller's newest run, which must be a success under eight days old.
#
# THE SQLITE BACKEND, named explicitly: with the Cloudflare variables set, d1-dump would otherwise pick the d1 backend, which
# creates a database and needs a token that can. This token only reads the bucket.
#
# THE FILES DRILL (R3) follows: `d1-dump drill-files` restores a sample of each files backup in the bucket (files/<name>/)
# with restoreFiles into a scratch directory and checks the restored bytes against the copies and their etags. It runs the
# d1-dump release named in D1_DUMP_FILES_REF below (the first with drill-files), so every caller gets it with its devkit pin;
# a bucket with no files backup passes with nothing to drill.
#
# A FAILURE REACHES DUSTIN on the scoreboard as well as GitHub's mail: devkit-ops-audit's R1 reads this workflow's newest
# run for every site in live/areas.json each day, and the board shows the site red until a drill passes.
#
# EXIT 0 PASSED, 1 THE DRILL REFUSED THE DUMP, 3 COULD NOT RUN. Either failure fails the job; the annotation says which.
#
# A CALLER (examples/restore-drill-caller.yml) pins a full 40-character sha; scripts/check-callers.mjs fails on anything else.
# It pins d1-dump too: `d1-dump-ref` has no default, so a d1-dump release reaches the drill through a reviewed change.

on:
  workflow_call:
    inputs:
      bucket:
        description: The R2 bucket the nightly dump writes to (the BACKUPS binding's bucket name).
        required: true
        type: string
      d1-dump-ref:
        description: The d1-dump release tag the drill runs, such as v0.7.0.
        required: true
        type: string
      files-sample:
        description: How many copies of each files backup the files drill restores and checks.
        required: false
        type: number
        default: 5
      node-version:
        description: The Node version; d1-dump needs 24.14.1 or later.
        required: false
        type: string
        default: "24"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

env:
  D1_DUMP_FILES_REF: v0.10.0

jobs:
  drill:
    name: restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Restore the newest complete dump and check it
        env:
          BUCKET: ${{ inputs.bucket }}
          D1_DUMP_REF: ${{ inputs.d1-dump-ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes "github:DrDustinEdwards/d1-dump#${D1_DUMP_REF}" drill --bucket "$BUCKET" --backend sqlite 2>&1 | tee "$RUNNER_TEMP/drill.txt"
          code=${PIPESTATUS[0]}
          { echo '```'; cat "$RUNNER_TEMP/drill.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "1" ]; then
            echo "::error::the restore drill refused the newest dump of ${BUCKET}; the backup does not restore."
          elif [ "$code" != "0" ]; then
            echo "::error::the restore drill could not run (exit ${code}); nothing was proven about ${BUCKET}."
          fi
          exit "$code"

      # Runs after a refused dump too, so one run says whether the files restore as well.
      - name: Restore a sample of files and check the bytes
        if: success() || failure()
        env:
          BUCKET: ${{ inputs.bucket }}
          SAMPLE: ${{ inputs.files-sample }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes "github:DrDustinEdwards/d1-dump#${D1_DUMP_FILES_REF}" drill-files --bucket "$BUCKET" --sample "$SAMPLE" 2>&1 | tee "$RUNNER_TEMP/files.txt"
          code=${PIPESTATUS[0]}
          { echo '```'; cat "$RUNNER_TEMP/files.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "1" ]; then
            echo "::error::the files drill refused a restored file from ${BUCKET}; a files backup does not restore byte for byte."
          elif [ "$code" != "0" ]; then
            echo "::error::the files drill could not run (exit ${code}); nothing was proven about the files in ${BUCKET}."
          fi
          exit "$code"
