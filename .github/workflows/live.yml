name: live

# THE COMPLETENESS SCOREBOARD. Every day, devkit-live (bin/live.mjs) runs each area's live check (live/areas.json) against
# every live site (live/sites.json) and adds the run to the orphan scoreboard branch; the board is then rebuilt from the
# runs there and the verifiers' verdicts (live/verdicts/), and published beside them:
#
#   https://github.com/DrDustinEdwards/devkit/blob/scoreboard/SCOREBOARD.md
#
# A push to main that changes live/ rebuilds the board without running the checks, so a merged verdict shows at once.
# The run fails when any check fails, so a gap on a live site turns this red on its own; a check that could not measure
# is a warning with its reason, and its cell says "could not measure" on the board.
#
# LIVE_GITHUB_TOKEN, when set, is a fine-grained token (resource owner DrDustinEdwards, all repositories, Contents read,
# Pull requests read, Metadata read) for counting the lines of each area's pull requests in the private repositories too,
# and for the copies job's scan of the private repositories' code. PSI_API_KEY, when
# set, is a PageSpeed Insights API key for area 7's lab and field numbers; Google's keyless quota refuses most days.
#
# MCP_TEST_GRANT_<HOST>, one per MCP server (the host upper-cased, every other character an underscore), is a READ-ONLY
# agent key for that server: area 11's site-runtime-ai-audit reads it for tools/list, the conformance server scenarios
# and the rate-limit burst. bin/live.mjs hands these only to a check marked "grants": true in live/areas.json, and the
# audit never prints one. A server without its secret is still checked without a token, and the board says what was
# skipped. A new MCP server adds its line below and its secret.
#
# The copies job is the network-wide check beside the per-site ones: bin/copies.mjs runs jscpd over every public
# repository's source at once and fails when more blocks are copied between repositories than live/copies.json's baseline
# (44 on 2026-11-06, from the shared-code audit; lowered as copies are removed). devkit-shared's copies check matches by name, so this catches a copy
# under a new name. A pull request that changes the scan or its baseline runs it too. With LIVE_GITHUB_TOKEN it reads the
# private repositories as well; without it, the public ones and a warning.

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths: ["live/**", "bin/live.mjs", "bin/copies.mjs"]
  pull_request:
    paths: ["live/copies.json", "bin/copies.mjs", ".github/workflows/live.yml"]
  workflow_dispatch:

concurrency:
  group: live-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs the checks, which install and execute other repositories' code: read-only token, no credential left in .git, and
  # bin/live.mjs hands each check only the variables it declares (checkEnv). It cannot push; the next job alone can.
  run:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Area 9's devkit-a11y drives Chromium with axe-core and finds both from the working directory, so they install here
      # without touching the lockfile; the check packages themselves install with --ignore-scripts and bring neither.
      - name: Chromium and axe-core for the accessibility check
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.63.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Run every area's checks against every live site
        env:
          LIVE_GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          MCP_TEST_GRANT_MCP_DUSTINEDWARDS_INFO: ${{ secrets.MCP_TEST_GRANT_MCP_DUSTINEDWARDS_INFO }}
          MCP_TEST_GRANT_CARREL_MCP_DUSTINEDWARDS_INFO: ${{ secrets.MCP_TEST_GRANT_CARREL_MCP_DUSTINEDWARDS_INFO }}
          MCP_TEST_GRANT_ADMIN_MCP_DUSTINEDWARDS_INFO: ${{ secrets.MCP_TEST_GRANT_ADMIN_MCP_DUSTINEDWARDS_INFO }}
          MCP_TEST_GRANT_ADMIN_MCP_FOXING_APP: ${{ secrets.MCP_TEST_GRANT_ADMIN_MCP_FOXING_APP }}
          MCP_TEST_GRANT_ADMIN_MCP_FOXHOUNDAPP_COM: ${{ secrets.MCP_TEST_GRANT_ADMIN_MCP_FOXHOUNDAPP_COM }}
          MCP_TEST_GRANT_FOXHOUNDAPP_COM: ${{ secrets.MCP_TEST_GRANT_FOXHOUNDAPP_COM }}
        run: node bin/live.mjs run --out "$RUNNER_TEMP/run.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-run
          path: ${{ runner.temp }}/run.json
          if-no-files-found: ignore
          retention-days: 1
      # Red only for a measured failure; a check that could not measure is a warning with its reason, never red or green.
      - name: Red when any check failed
        run: |
          node -e 'const esc = (t) => String(t).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"); const { results } = require(process.argv[1]); const bad = results.filter((r) => r.status !== "pass"); for (const r of bad) console.log(`::${r.status === "fail" ? "error" : "warning"} title=${esc(`area ${r.area} ${r.site}`)}::${esc(`${r.check} ${r.status}${r.detail ? `: ${r.detail}` : ` (${r.errors} errors)`}`)}`); process.exit(bad.some((r) => r.status === "fail") ? 1 : 0)' "$RUNNER_TEMP/run.json"

  # Alone holds the write token. It runs this repository's own code on the run's JSON (a data file), never a check.
  board:
    needs: run
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'push'
        continue-on-error: true
        with:
          name: live-run
          path: ${{ runner.temp }}
      - name: Add the run to the scoreboard branch and rebuild the board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --quiet --detach "$RUNNER_TEMP/board"
          cd "$RUNNER_TEMP/board"
          if git fetch --quiet --depth 1 origin scoreboard; then git checkout --quiet -B scoreboard FETCH_HEAD; else git checkout --quiet --orphan scoreboard && git rm -rfq .; fi
          mkdir -p runs
          if [ -f "$RUNNER_TEMP/run.json" ]; then cp "$RUNNER_TEMP/run.json" "runs/$(date -u +%F).json"; fi
          find runs -maxdepth 1 -name '*.json' | sort | head -n -60 | xargs -r git rm -q
          node "$GITHUB_WORKSPACE/bin/live.mjs" board --config "$GITHUB_WORKSPACE/live" --runs runs --out board.json --md SCOREBOARD.md
          cat SCOREBOARD.md >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if git diff --cached --quiet; then echo "The board is current."; exit 0; fi
          git commit --quiet -m "Scoreboard $(date -u +%F)"
          git push --quiet origin scoreboard

  copies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: No more code copied between repositories than the baseline
        env:
          LIVE_GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
        run: node bin/copies.mjs
