name: scorecard-self

# devkit's own OpenSSF Scorecard through its own scorecard.yml (this commit's copy), as every public repository's is
# (examples/scorecard-caller.yml): nightly, not on every push (README, "No second run on main").

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/scorecard.yml
