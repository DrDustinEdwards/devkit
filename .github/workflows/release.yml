name: release

# A release is the merge of its version bump: when the caller's package.json version on its default branch has no
# v<version> tag yet, this tags that commit and publishes a GitHub release whose notes are the version's own CHANGELOG
# section (a "## 0.19.0 (date)" or "## [0.19.0]" heading down to the next "## "), or GitHub's generated notes when the
# CHANGELOG has none. Nobody pushes a tag by hand, and a session that cannot push tags can still release by merging.
# It is site-runtime's and Capsomer's release job, once, for every package repository.
#
# A tag made with the workflow's own token starts no other workflow (GitHub's rule against loops), so the caller runs
# bump-consumers.yml after this when `created` is true (examples/release-caller.yml). Run the caller by hand to release a
# version that merged without a tag.
#
# A CALLER pins a full 40-character sha; scripts/check-callers.mjs fails on anything else. The caller's job grants
# contents: write, which this needs to create the tag and the release.

on:
  workflow_call:
    inputs:
      timeout-minutes:
        required: false
        type: number
        default: 5
    outputs:
      created:
        description: "'true' when this run created the tag and the release."
        value: ${{ jobs.tag.outputs.created }}
      tag:
        description: The tag for package.json's version, created or not.
        value: ${{ jobs.tag.outputs.tag }}

permissions: {}

jobs:
  tag:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::release runs only on the default branch ($DEFAULT_BRANCH), not $GITHUB_REF."
            exit 1
          fi
          version="$(jq -r .version package.json)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version \"$version\" is not X.Y.Z."
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              index($0, "## " v " ") == 1 || $0 == "## " v || index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
