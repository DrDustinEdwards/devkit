name: release

# A release is the merge of its version bump: when a package.json version on the caller's default branch has no
# v<version> tag yet, this tags the commit that set it and publishes a GitHub release whose notes are the version's own CHANGELOG
# section (a "## 0.19.0 (date)" or "## [0.19.0]" heading down to the next "## "), or GitHub's generated notes when the
# CHANGELOG has none. Nobody pushes a tag by hand, and a session that cannot push tags can still release by merging.
# It is the release job, once, for every package repository installed by git tag.
#
# BUILD. A package that ships built files (Capsomer's dist/) passes `build: true`: the job runs `npm ci` (whose prepare
# script builds), drops the prepare script, commits the built files on top of the merged commit and tags that commit, which
# is on no branch (one such commit for each version it releases). An app installing github:DrDustinEdwards/<package>#vX.Y.Z then gets the package as built, with no build
# and none of the package's devDependencies at install time.
#
# PROVENANCE (checklist C7). Each new release packs the tagged tree with `npm pack --ignore-scripts`, attests the tarball
# with GitHub's build provenance (actions/attest-build-provenance, a Sigstore-signed SLSA statement naming this workflow
# run) and attaches it to the release, so anyone can check a release came from this workflow:
#   gh release download vX.Y.Z -R DrDustinEdwards/<package> -p '*.tgz'
#   gh attestation verify <package>-X.Y.Z.tgz -R DrDustinEdwards/<package>
#
# CATCH-UP. A caller's concurrency group runs one release at a time and keeps only ONE waiting run (GitHub's concurrency
# docs: a newer pending run cancels the older pending one, whatever cancel-in-progress says), so two version-bump merges
# that land while a run is going leave one bump without a run. Each run therefore releases every untagged bump, not only
# the one it started on: the commits on the default branch's first-parent line since the tenth newest tag that changed
# package.json's version, oldest first, each tagged on its own commit with its own CHANGELOG section. A bump that was
# skipped is released by the next run; no tag is ever moved or replaced (a tag that exists is left alone).
#
# A tag made with the workflow's own token starts no other workflow (GitHub's rule against loops), so the caller runs
# bump-consumers.yml after this when `created` is true (examples/release-caller.yml). Run the caller by hand to release a
# version that merged without a tag.
#
# A CALLER pins a full 40-character sha; scripts/check-callers.mjs fails on anything else. The caller's job grants
# contents: write (the tag, the release and its tarball), id-token: write (the Sigstore certificate) and
# attestations: write (storing the attestation).

on:
  workflow_call:
    inputs:
      timeout-minutes:
        required: false
        type: number
        default: 5
      build:
        description: Build with `npm ci` and tag a release commit that holds the built files (see BUILD above).
        required: false
        type: boolean
        default: false
      node-version-file:
        description: The Node.js version file setup-node reads when `build` is true.
        required: false
        type: string
        default: .node-version
    outputs:
      created:
        description: "'true' when this run created the tag and the release."
        value: ${{ jobs.tag.outputs.created }}
      tag:
        description: The tag for package.json's version, created or not.
        value: ${{ jobs.tag.outputs.tag }}

permissions: {}

jobs:
  tag:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      created: ${{ steps.publish.outputs.created || steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - if: inputs.build
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      # Reads only: the default-branch guard, then the list of versions to release in $RUNNER_TEMP/releases.tsv (tag and
      # commit, oldest first) and each one's CHANGELOG section in $RUNNER_TEMP/notes/. The build below runs the package's
      # own code (its prepare script and, through npm ci, its dependencies), so it holds no token.
      - id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::release runs only on the default branch ($DEFAULT_BRANCH), not $GITHUB_REF."
            exit 1
          fi
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          version="$(jq -r .version package.json)"
          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "::error::package.json version \"$version\" is not X.Y.Z."
            exit 1
          fi
          head_tag="v$version"
          echo "tag=$head_tag" >> "$GITHUB_OUTPUT"
          tags="$RUNNER_TEMP/tags.txt"
          git tag -l 'v[0-9]*.[0-9]*.[0-9]*' > "$tags"
          releases="$RUNNER_TEMP/releases.tsv"
          : > "$releases"
          # The bumps since the tenth newest tag, so a bump skipped between two tags is found too. A build release's tag is
          # on a commit off the branch, so its anchor is its parent.
          newest="$(sort -V "$tags" | tail -n 10 | head -n 1)"
          anchor=""
          if [ -n "$newest" ]; then
            anchor="$(git rev-parse "$newest^{commit}")"
            if ! git merge-base --is-ancestor "$anchor" HEAD; then
              anchor="$(git rev-parse "$anchor^" 2>/dev/null || true)"
            fi
            if [ -z "$anchor" ] || ! git merge-base --is-ancestor "$anchor" HEAD; then
              echo "::warning::$newest is not on $DEFAULT_BRANCH; releasing only package.json's version."
              anchor=""
            fi
          fi
          if [ -n "$anchor" ]; then
            prev="$(git show "$anchor:package.json" | jq -r .version)"
            while read -r -u 3 sha; do
              v="$(git show "$sha:package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)"
              printf '%s' "$v" | grep -Eq "$semver" || continue
              [ "$v" = "$prev" ] && continue
              prev="$v"
              grep -qx "v$v" "$tags" && continue
              printf 'v%s\t%s\n' "$v" "$sha" >> "$releases"
            done 3< <(git rev-list --first-parent --reverse "$anchor..HEAD" -- package.json)
          fi
          # The version at HEAD is always considered, for a first release or a run by hand.
          if ! grep -qx "$head_tag" "$tags" && ! cut -f1 "$releases" | grep -qx "$head_tag"; then
            printf '%s\t%s\n' "$head_tag" "$(git rev-parse HEAD)" >> "$releases"
          fi
          if [ ! -s "$releases" ]; then
            echo "$head_tag already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/notes"
          while IFS=$'\t' read -r -u 3 tag sha; do
            echo "release $tag at $sha"
            git show "$sha:CHANGELOG.md" 2>/dev/null | awk -v v="${tag#v}" '
              index($0, "## " v " ") == 1 || $0 == "## " v || index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' > "$RUNNER_TEMP/notes/$tag.md" || true
          done 3< "$releases"

      # npm ci installs without lifecycle scripts; the package's own prepare script then builds. Each version is built
      # on its own commit and committed and tagged locally; releases.tsv then names the release commits.
      - name: Build the package
        if: steps.release.outputs.new == 'true' && inputs.build
        run: |
          built="$RUNNER_TEMP/releases.built.tsv"
          : > "$built"
          while IFS=$'\t' read -r -u 3 tag sha; do
            git checkout -q --force "$sha"
            git clean -ffdxq
            npm ci --ignore-scripts
            npm run prepare
            # The release commit holds the built files and no prepare script.
            node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); delete p.scripts.prepare; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
            git add -f dist package.json
            git -c user.name="github-actions[bot]" -c user.email="41898341+github-actions[bot]@users.noreply.github.com" commit -q -m "Release $tag: the built package"
            git tag "$tag"
            printf '%s\t%s\n' "$tag" "$(git rev-parse HEAD)" >> "$built"
          done 3< "$RUNNER_TEMP/releases.tsv"
          mv "$built" "$RUNNER_TEMP/releases.tsv"

      - id: publish
        name: Tag and publish the releases
        if: steps.release.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
        run: |
          while IFS=$'\t' read -r -u 3 tag sha; do
            if [ "$BUILD" = "true" ]; then
              git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            # A backfilled version older than the newest tag is not the latest release.
            latest="--latest"
            top="$(printf '%s\n%s\n' "$tag" "$(sort -V "$RUNNER_TEMP/tags.txt" | tail -n 1)" | sort -V | tail -n 1)"
            [ "$top" = "$tag" ] || latest="--latest=false"
            if [ -s "$RUNNER_TEMP/notes/$tag.md" ]; then
              gh release create "$tag" "$latest" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes/$tag.md"
            else
              gh release create "$tag" "$latest" --verify-tag --title "$tag" --generate-notes
            fi
          done 3< "$RUNNER_TEMP/releases.tsv"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - id: pack
        name: Pack the releases
        if: steps.publish.outputs.created == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          while IFS=$'\t' read -r -u 3 _ sha; do
            git checkout -q --force "$sha"
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          done 3< "$RUNNER_TEMP/releases.tsv"

      - name: Attest the releases' provenance
        if: steps.publish.outputs.created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pack/*.tgz

      - name: Attach each tarball to its release
        if: steps.publish.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r -u 3 tag _; do
            tarball="$(ls "$RUNNER_TEMP"/pack/*-"${tag#v}".tgz)"
            gh release upload "$tag" "$tarball" -R "$GITHUB_REPOSITORY"
          done 3< "$RUNNER_TEMP/releases.tsv"
