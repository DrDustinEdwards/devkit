name: pr-footer

# NO "GENERATED BY CLAUDE CODE" FOOTER ON A PULL REQUEST DESCRIPTION: the rule ai-author.yml holds commits to, for
# descriptions. A cloud session's GitHub connection appends the footer to every description it writes and puts it back
# when the session removes it, so the repository removes it after the fact.
#
# THE SCRIPT IS INLINE: scripts/strip-pr-footer.mjs, written into the heredoc below by scripts/inline-rollback-guard.mjs,
# so a caller that pins one devkit sha runs the script of that same commit and needs no package release.
# test/pr-footer-workflow.test.mjs fails when the two disagree.
#
# ON A PULL REQUEST it fixes that one description, and only for the repository's own branches: a fork's token cannot
# write the description. A synchronize changes no description and is skipped. ON A DISPATCH it reads every pull request
# and fixes each one that carries the footer. An edit made with GITHUB_TOKEN starts no new run, so there is no loop.
#
# THE CALLER grants `contents: read` and `pull-requests: write` to its calling job (examples/pr-footer-caller.yml), because
# a called workflow can hold no more than its caller gives it; with the write alone the run fails at startup. It pins a full 40-character sha; scripts/check-callers.mjs fails on anything
# else.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  strip:
    name: No Claude Code footer on the description
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the footer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > "$RUNNER_TEMP/strip-pr-footer.mjs" <<'PR_FOOTER'
          // Strips the "Generated by Claude Code" footer from pull request descriptions, the no-AI-trailer rule ai-author.yml holds
          // commits to, for descriptions. A cloud session's GitHub connection appends the footer to every description it writes and
          // puts it back when the session removes it, so the repository removes it instead. pr-footer.yml
          // carries this file inline (scripts/inline-rollback-guard.mjs) and runs it on each opened or edited pull request, and by
          // hand (workflow_dispatch) over every pull request. An edit made with the workflow's GITHUB_TOKEN starts no new run, so
          // there is no loop.
          //
          // NO node_modules IMPORTS: the job runs without npm ci.

          // The footer as the connection writes it: a rule, then one italic line linking Claude
          // Code, at the end of the description. Also the "Generated with Claude Code" wording.
          const FOOTER = /\s*(?:^|\n)-{3,}\s*\n+\s*_?(?:🤖\s*)?Generated (?:by|with) \[Claude Code\]\([^)]*\)_?\s*$/u;
          // The bare line, with no rule above it, and a session link left on its own.
          const BARE = /\s*\n(?:🤖\s*)?_?Generated (?:by|with) \[Claude Code\]\([^)]*\)_?\s*$/u;
          const SESSION_LINK = /\s*\nhttps:\/\/claude\.ai\/code\/session_[A-Za-z0-9]+\s*$/u;

          /** The description without the footer, or null when it carries none. @param {unknown} body @returns {string | null} */
          export function stripFooter(body) {
            if (typeof body !== "string") return null;
            let out = body;
            for (let i = 0; i < 4; i++) {
              const next = out.replace(FOOTER, "").replace(BARE, "").replace(SESSION_LINK, "");
              if (next === out) break;
              out = next;
            }
            return out === body ? null : `${out.trimEnd()}\n`;
          }

          async function gh(path, init = {}) {
            const res = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
            });
            if (!res.ok) throw new Error(`${init.method ?? "GET"} ${path}: ${res.status} ${(await res.text()).slice(0, 200)}`);
            return res.json();
          }

          async function fix(repo, number, body) {
            const stripped = stripFooter(body);
            if (stripped === null) return false;
            await gh(`/repos/${repo}/pulls/${number}`, { method: "PATCH", body: JSON.stringify({ body: stripped }) });
            return true;
          }

          async function main() {
            const repo = process.env.GITHUB_REPOSITORY;
            if (!repo || !process.env.GITHUB_TOKEN) throw new Error("GITHUB_REPOSITORY and GITHUB_TOKEN are required");
            const one = process.env.PR_NUMBER;
            if (one) {
              const pr = await gh(`/repos/${repo}/pulls/${one}`);
              console.log(`#${one}: ${(await fix(repo, one, pr.body)) ? "footer removed" : "no footer"}`);
              return;
            }
            let read = 0;
            let fixed = 0;
            for (let page = 1; page <= 50; page++) {
              const prs = await gh(`/repos/${repo}/pulls?state=all&per_page=100&page=${page}`);
              for (const pr of prs) {
                read++;
                if (await fix(repo, pr.number, pr.body)) fixed++;
              }
              if (prs.length < 100) break;
            }
            console.log(`${read} pull request(s) read, ${fixed} footer(s) removed`);
          }

          if (import.meta.url === `file://${process.argv[1]}`) {
            main().catch((err) => {
              console.error(err instanceof Error ? err.message : String(err));
              process.exit(1);
            });
          }
          PR_FOOTER
          node "$RUNNER_TEMP/strip-pr-footer.mjs"
