name: ci

# Pull requests only: a merge was checked as one, and devkit's ruleset lets nothing else onto main (README, "No second run
# on main"). release-self.yml and shared-list.yml are what a merge starts.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base-branch parent, which the changeset step diffs.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # TypeScript, which the code-map tests read their fixture through and the typecheck runs, with the Node and Vite types
      # it reads.
      - run: npm ci
      # Merging and releasing are two steps (.changeset/README.md): a pull request adds a changeset and leaves the version
      # alone; the release pull request sets the version and uses up every changeset. Renovate's bumps release nothing.
      - name: A changeset, or the release itself
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
        run: |
          was=$(git show HEAD^1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          now=$(node -p 'require("./package.json").version')
          if [ "$was" = "$now" ]; then
            npx changeset status --since=HEAD^1
          else
            left=$(find .changeset -name '*.md' ! -name README.md)
            [ -z "$left" ] || { echo "::error::The version moved from $was to $now, but changesets are left: $left. A release is \`npx changeset version\` on main, alone."; exit 1; }
          fi
      - name: Typecheck the package, the bins and the scripts against their declarations
        run: npm run typecheck
      # The shared Oxlint config (lint/oxlint.mjs) on devkit itself, type-aware, as every repository will run it.
      - name: Lint with the shared Oxlint config
        run: npm run lint
      # The shared Oxfmt config (lint/oxfmt.mjs) on devkit itself, as every repository runs it.
      - name: Format check with the shared Oxfmt config
        run: npm run format:check
      - name: Hold the shared workflows to their properties, the caller check to its pin rule, and the package to its behavior
        run: node --test "test/*.test.mjs"
      - name: The example callers are themselves pinned
        run: node scripts/check-callers.mjs examples/*.yml
      # The scoreboard's site, area and verdict files, so a verdict signed by its own builder never merges.
      - name: The scoreboard's files are sound
        run: node bin/live.mjs lint
      # The no-bloat ratchet on devkit itself runs in checks-self.yml, through pr.yml, as a caller's does.

  # devkit's own workflows through the shared audits it ships, this commit's copy of each (as code-map-self.yml does).
  workflow-audit:
    uses: ./.github/workflows/workflow-audit.yml

  dependencies:
    uses: ./.github/workflows/dependencies.yml
