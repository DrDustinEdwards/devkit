name: code-map-self

# Nightly, devkit maps its own scripts with its own code-map workflow (main's copy) and publishes code-map.json to the
# code-map branch for the Capsid system explorer, as examples/code-map-caller.yml does (not on every push since 0.25.0:
# README, "No second run on main"). Monday's run (its own cron line) and a manual one also run Stryker on its own checks
# (stryker.config.mjs), failing below a module's bar; the other nights reuse its numbers.

on:
  schedule:
    - cron: "41 4 * * 0,2-6"
    - cron: "41 4 * * 1"
  workflow_dispatch:

# One run at a time, so an older push's map never lands after a newer one, nor over the weekly mutation run.
concurrency:
  group: code-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  code-map:
    # A called workflow holds no more than this job grants: the write lets it push code-map.json to the code-map branch.
    permissions:
      contents: write
    uses: ./.github/workflows/code-map.yml
    with:
      include: scripts/ bin/ testing/
      # Node's test runner does not create the destination folder.
      coverage-command: mkdir -p coverage && node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info "test/*.test.mjs"
      coverage-file: coverage/lcov.info
      mutation-command: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '41 4 * * 1') && 'node stryker.config.mjs' || '' }}
      mutation-file: reports/mutation/*.json
      timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '41 4 * * 1') && 90 || 20 }}
