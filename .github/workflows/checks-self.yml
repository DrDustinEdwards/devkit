name: checks-self

# devkit's own pull requests and pushes through its own checks.yml (this commit's copy), as every caller's are: the footer
# strip, the trailer check and the shared-code check in one job.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.action == 'edited') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/checks.yml
