name: checks

# THE SMALL CHECKS IN ONE JOB. Until 0.21.0 they were three workflows, each starting a runner of its own on every push and
# pull request (the queue of 2026-10-31 was mostly these). One runner does all three, in this order:
#
#   1. On a pull request opened, reopened or edited, and on a dispatch: remove the "Generated by Claude Code" footer from the
#      description (scripts/strip-pr-footer.mjs; a dispatch fixes every pull request). Only the repository's own branches:
#      a fork's token cannot write the description.
#   2. On a push and on a pull request opened, reopened or pushed to: refuse an AI trailer on the commits it adds, and on a
#      pull request a commit authored or committed as Claude (bin/check-trailers.mjs).
#   3. The same events: the shared-code check (bin/shared.mjs), against each shared package at its newest tag.
#
# Each step is a composite action in .github/actions/ (footer, trailers, shared), the one copy pr.yml runs too. pr.yml is
# the successor: these three and every other pull request check in one job (README, "One job per pull request").
#
# An edit of the description or a dispatch adds no commits, so it runs step 1 alone and checks out nothing of the caller's.
#
# NOTHING TO INSTALL: the job checks out devkit at the very commit the caller pinned (job.workflow_sha) and runs its files
# with Node alone; the spelling check runs codespell through pipx, which the runner has. The full history is fetched for
# the trailer check.
#
# THE CALLER (examples/checks-caller.yml) grants `contents: read` and `pull-requests: write` to its calling job, because a
# called workflow holds no more than its caller gives it. It pins a full 40-character sha; scripts/check-callers.mjs fails
# on anything else.

on:
  workflow_call:
    inputs:
      timeout-minutes:
        required: false
        type: number
        default: 10

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CODE: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'edited') }}
      FOOTER: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # An empty ref checks out devkit's default branch, so the caller's pin would mean nothing.
      - name: Know the commit the caller pinned
        env:
          PINNED: ${{ job.workflow_sha }}
        run: test -n "$PINNED" || { echo "::error::job.workflow_sha is empty, so devkit cannot be read at the caller's pin."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DrDustinEdwards/devkit
          ref: ${{ job.workflow_sha }}
          path: .devkit
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          # Nothing is installed, and setup-node's automatic cache fails in a pnpm repository (no pnpm on the runner).
          package-manager-cache: false

      - name: No Claude Code footer on the description
        if: env.FOOTER == 'true'
        uses: ./.devkit/.github/actions/footer

      # Full history, so the trailer check can read every commit in the range a push or pull request adds. The caller's
      # files sit beside .devkit, which the shared-code check skips as it skips every dot directory.
      - if: env.CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: No AI trailer or author on new commits
        if: env.CODE == 'true'
        uses: ./.devkit/.github/actions/trailers

      - name: Uses the shared code
        if: env.CODE == 'true'
        uses: ./.devkit/.github/actions/shared
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
