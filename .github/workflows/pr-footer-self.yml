name: pr-footer-self

# devkit's own pull requests lose the "Generated by Claude Code" footer through its own pr-footer workflow (this commit's
# copy), as every caller's do.

on:
  pull_request:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-footer:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-footer.yml
