name: review
description: >-
  The automatic PR reviewer (scripts/review-check.mjs): asks Capsid, with the job's OIDC token, to review the pull request
  and writes its verdict to a "review verdict" check and the job summary. Advisory: it never fails. The job grants
  id-token and checks write, and no other step of that job runs caller code. One copy for review.yml and pr.yml.

runs:
  using: composite
  steps:
    - name: Review the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/review-check.mjs"
