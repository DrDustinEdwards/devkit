name: workflow-audit
description: >-
  The caller's GitHub Actions through actionlint 1.7.12 (with shellcheck 0.11.0 on every run script) and zizmor 1.31.1
  (the security audits, at its default persona), each a release file checked against its sha256. Any actionlint finding
  fails, and any zizmor finding at min-severity or above, each an annotation on its line. Both run even when the first
  fails. The reasons are in the header of workflow-audit.yml. One copy for workflow-audit.yml and pr.yml.

inputs:
  path:
    description: The caller's checkout, relative to the workspace.
    required: false
    default: repo
  actionlint:
    description: "'false' to skip actionlint."
    required: false
    default: "true"
  zizmor:
    description: "'false' to skip zizmor."
    required: false
    default: "true"
  min-severity:
    description: The lowest zizmor severity that fails (informational, low, medium or high).
    required: false
    default: medium

runs:
  using: composite
  steps:
    # shellcheck too, so a runner image's newer one never changes what fails.
    - name: Install actionlint 1.7.12 and shellcheck 0.11.0
      id: actionlint-install
      if: inputs.actionlint == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
        sha256sum -c - <<'SUMS'
        8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
        8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz
        SUMS
        tar -xzf actionlint.tar.gz actionlint
        tar -xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck

    - name: actionlint
      id: actionlint
      if: inputs.actionlint == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        FORMAT: '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}},title=actionlint {{$err.Kind}}::{{$err.Message}}\n{{end}}'
      run: |
        echo "## actionlint" >> "$GITHUB_STEP_SUMMARY"
        "$RUNNER_TEMP/actionlint" -shellcheck "$RUNNER_TEMP/shellcheck" -format "$FORMAT"
        echo "No finding." >> "$GITHUB_STEP_SUMMARY"

    # The binary from PyPI's manylinux wheel, which holds nothing else that runs.
    - name: Install zizmor 1.31.1
      id: zizmor-install
      if: ${{ !cancelled() && inputs.zizmor == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o zizmor.whl https://files.pythonhosted.org/packages/py3/z/zizmor/zizmor-1.31.1-py3-none-manylinux_2_28_x86_64.whl
        echo "58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410  zizmor.whl" | sha256sum -c -
        unzip -p zizmor.whl zizmor-1.31.1.data/scripts/zizmor > zizmor
        chmod +x zizmor

    # The online audits (impostor commits, known-vulnerable actions, ref confusion) read public repositories, which the
    # job's read-only token is enough for.
    - name: zizmor
      if: ${{ !cancelled() && steps.zizmor-install.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GH_TOKEN: ${{ github.token }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
      run: |
        echo "## zizmor" >> "$GITHUB_STEP_SUMMARY"
        "$RUNNER_TEMP/zizmor" --format github --min-severity "$MIN_SEVERITY" .
        echo "No finding at $MIN_SEVERITY or above." >> "$GITHUB_STEP_SUMMARY"
