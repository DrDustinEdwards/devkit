name: worker-size
description: >-
  The Worker bundle size budget (bin/worker-size.mjs, from the caller's own install of @dustinedwards/devkit):
  `wrangler deploy --dry-run` against the budget in .worker-size.json. One Worker from the inputs, or several in `workers`,
  each with its own prepare, summary section and annotations titled with its name, every one checked even when one fails.
  One copy for worker-size.yml and pr.yml.

inputs:
  path:
    description: The caller's checkout, installed, relative to the workspace.
    required: false
    default: repo
  prepare:
    description: For the one Worker, run from the caller's root before the check (a build, or copying wrangler.jsonc.example to wrangler.jsonc). Empty for none.
    required: false
    default: ""
  working-directory:
    description: Where the one Worker's wrangler config lives, relative to the caller's root.
    required: false
    default: .
  config:
    description: The one Worker's budget file, relative to working-directory.
    required: false
    default: .worker-size.json
  workers:
    description: 'Several Workers as a JSON array of { "name", "working-directory", "config", "prepare" } (only name is required; each prepare runs from the caller root, in order). Empty for the one Worker above.'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Prepare
      if: inputs.workers == '' && inputs.prepare != ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PREPARE: ${{ inputs.prepare }}
      run: bash -euo pipefail -c "$PREPARE"

    - name: Check
      if: inputs.workers == ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        CONFIG: ${{ inputs.config }}
        WORKDIR: ${{ inputs.working-directory }}
      run: |
        echo "## Worker bundle size" >> "$GITHUB_STEP_SUMMARY"
        # The Worker's own install first (a pnpm workspace package), then the repository root.
        bin="$PWD/$WORKDIR/node_modules/@dustinedwards/devkit/bin/worker-size.mjs"
        [ -f "$bin" ] || bin="$PWD/node_modules/@dustinedwards/devkit/bin/worker-size.mjs"
        if [ ! -f "$bin" ]; then
          echo "::error::@dustinedwards/devkit is not installed. Add it to devDependencies at a tag (see the devkit README)."
          exit 1
        fi
        cd "$WORKDIR"
        node "$bin" --config "$CONFIG"

    # Every Worker is checked even when one fails, so one run shows them all; the step fails if any did.
    - name: Check each Worker
      if: inputs.workers != ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        WORKERS: ${{ inputs.workers }}
      run: |
        echo "## Worker bundle size" >> "$GITHUB_STEP_SUMMARY"
        node --input-type=module - <<'EACH'
        import { spawnSync } from "node:child_process";
        import { appendFileSync, existsSync } from "node:fs";
        import { join, resolve } from "node:path";
        const root = process.cwd();
        const summary = (text) => process.env.GITHUB_STEP_SUMMARY && appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
        const KEYS = ["name", "working-directory", "config", "prepare"];
        let workers;
        try {
          workers = JSON.parse(process.env.WORKERS);
          const bad = !Array.isArray(workers) || !workers.length || workers.some((w) => !w || typeof w !== "object" || !/^[\w .-]+$/.test(w.name ?? "") || Object.keys(w).some((k) => !KEYS.includes(k) || typeof w[k] !== "string"));
          if (bad) throw new Error(`not a non-empty array of objects with a name (letters, digits, space, dot, dash) and only the string fields ${KEYS.join(", ")}`);
        } catch (error) {
          console.log(`::error::the workers input: ${error.message}`);
          process.exit(1);
        }
        const failed = [];
        for (const w of workers) {
          const dir = resolve(root, w["working-directory"] ?? ".");
          console.log(`::group::${w.name}`);
          summary(`\n### ${w.name}\n\n`);
          let ok = true;
          if (w.prepare) {
            const r = spawnSync("bash", ["-euo", "pipefail", "-c", w.prepare], { cwd: root, stdio: "inherit" });
            if (r.status !== 0) {
              ok = false;
              console.log(`::error title=${w.name}::its prepare failed (${r.error?.message ?? `exit ${r.status ?? r.signal}`}), so its size was not measured.`);
              summary("Its prepare failed, so its size was not measured.\n");
            }
          }
          // The Worker's own install first (a pnpm workspace package), then the repository root.
          const bin = ok && [dir, root].map((d) => join(d, "node_modules/@dustinedwards/devkit/bin/worker-size.mjs")).find((f) => existsSync(f));
          if (ok && !bin) {
            ok = false;
            console.log(`::error title=${w.name}::@dustinedwards/devkit is not installed. Add it to devDependencies at a tag (see the devkit README).`);
          }
          if (ok) {
            const r = spawnSync(process.execPath, [bin, "--config", w.config ?? ".worker-size.json"], { cwd: dir, encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
            process.stdout.write(`${r.stdout ?? ""}${r.stderr ?? ""}`.replace(/^::(error|warning)::/gm, `::$1 title=${w.name}::`));
            if (r.status !== 0) ok = false;
          }
          console.log("::endgroup::");
          if (!ok) failed.push(w.name);
        }
        console.log(failed.length ? `::error::over budget or not measured: ${failed.join(", ")}` : `every Worker is within its budget (${workers.length})`);
        process.exit(failed.length ? 1 : 0);
        EACH
