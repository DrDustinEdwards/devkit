name: osv-scanner
description: >-
  Known vulnerabilities in every lockfile of the caller's checkout, found by OSV-Scanner 2.7.0 (checked against its
  sha256). With a base commit (a pull request or a merge group) it scans the base too and fails only on a vulnerability
  the change adds, OSV-Scanner's documented pull request mode; without one it lists every known vulnerability as a
  warning and passes. The reasons are in the header of dependencies.yml. One copy for dependencies.yml and pr.yml.

inputs:
  path:
    description: The caller's checkout (the head), relative to the workspace. The base is checked out beside it, at base/.
    required: false
    default: repo
  base-sha:
    description: The commit the change is compared with. Empty to list every known vulnerability without failing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.base-sha != ''
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ inputs.base-sha }}
        path: base
        persist-credentials: false

    - name: Install OSV-Scanner 2.7.0
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
        echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
        chmod +x osv-scanner

    # Without --config each lockfile reads only an osv-scanner.toml in its own folder, so the head's root file applies to
    # both scans. A package with no dependencies has no lockfile, and passes. Exit 1 means vulnerabilities were found;
    # anything above it is a failed scan (bash -e would stop on either, hence `|| code=$?`). A vulnerability is the same
    # one in both scans when its ecosystem, package and advisory match, so a version bump that keeps the hole is not new
    # and one that brings a new advisory is.
    - name: Scan every lockfile
      shell: bash
      env:
        HEAD_DIR: ${{ inputs.path }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        set -uo pipefail
        echo "## OSV-Scanner" >> "$GITHUB_STEP_SUMMARY"
        config=()
        if [ -f "$HEAD_DIR/osv-scanner.toml" ]; then config=(--config "$PWD/$HEAD_DIR/osv-scanner.toml"); fi
        scan() {
          local code=0
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --allow-no-lockfiles --format json "${config[@]}" "$1" > "$RUNNER_TEMP/$2.json" || code=$?
          if [ "$code" -gt 1 ]; then echo "::error::OSV-Scanner could not scan $1 (exit $code)."; exit "$code"; fi
          jq -r --arg root "$PWD/$1/" '.results[] | (.source.path | ltrimstr($root)) as $file | .packages[] | .package as $p
            | .groups[] | [$p.ecosystem, $p.name, (.ids | sort | first), $p.version, $file, (.max_severity // "")] | @tsv' \
            "$RUNNER_TEMP/$2.json" | sort -u > "$RUNNER_TEMP/$2.tsv"
        }
        scan "$HEAD_DIR" osv-head
        if [ -n "$BASE_SHA" ]; then
          scan base osv-base
          cut -f1-3 "$RUNNER_TEMP/osv-base.tsv" | sort -u > "$RUNNER_TEMP/osv-known"
          awk -F '\t' 'NR == FNR { known[$0]; next } !(($1 FS $2 FS $3) in known)' OFS='\t' "$RUNNER_TEMP/osv-known" "$RUNNER_TEMP/osv-head.tsv" > "$RUNNER_TEMP/osv-found"
          what="this change adds"
        else
          cp "$RUNNER_TEMP/osv-head.tsv" "$RUNNER_TEMP/osv-found"
          what="known"
        fi
        count=$(wc -l < "$RUNNER_TEMP/osv-found")
        level=error
        [ -n "$BASE_SHA" ] || level=warning
        while IFS=$'\t' read -r eco name id version file severity; do
          echo "::$level file=$file,title=$id::$eco $name $version has $id (severity ${severity:-unknown}): https://osv.dev/$id"
        done < "$RUNNER_TEMP/osv-found"
        echo "Vulnerabilities $what: $count." | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$count" -gt 0 ] && [ "$level" = error ]; then exit 1; fi
