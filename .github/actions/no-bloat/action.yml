name: no-bloat
description: >-
  Knip, jscpd and the test count against the caller's committed baseline (bin/no-bloat.mjs, from the caller's own install
  of @dustinedwards/devkit), and on a pull request the lines it adds and removes in the job summary. A pull request's
  checkout is its merge commit, whose first parent is the base. One copy for no-bloat.yml and pr.yml.

inputs:
  path:
    description: The caller's checkout, installed, relative to the workspace.
    required: false
    default: repo
  prepare:
    description: Run from the caller's root after the install and before the check, for generated files the code imports. Empty for none.
    required: false
    default: ""
  config:
    description: The no-bloat config, with the runs and the baseline (see bin/no-bloat.mjs).
    required: false
    default: .no-bloat.json

runs:
  using: composite
  steps:
    - name: Prepare
      if: inputs.prepare != ''
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PREPARE: ${{ inputs.prepare }}
      run: bash -euo pipefail -c "$PREPARE"

    - name: Check
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        CONFIG: ${{ inputs.config }}
        LINES_FROM: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      run: |
        echo "## No-bloat ratchet" >> "$GITHUB_STEP_SUMMARY"
        bin=node_modules/@dustinedwards/devkit/bin/no-bloat.mjs
        if [ ! -f "$bin" ]; then
          echo "::error::@dustinedwards/devkit is not installed. Add it to devDependencies at a tag (see the devkit README)."
          exit 1
        fi
        # The bin is the caller's own install, so a change could install an older devkit, a fork or a rewritten bin whose
        # check lets more in. The workflow's own devkit checks it first: an x.y.z no older than its own, every file the
        # file at that release's tag.
        # An earlier step's GITHUB_ENV line (an install script's, the prepare's) could load code into node; the bin runs
        # without those variables, and installs knip and jscpd itself, so nothing the install put in node_modules counts.
        clean=(env -u NODE_OPTIONS -u NODE_PATH -u LD_PRELOAD -u LD_LIBRARY_PATH -u DEVKIT_NO_BLOAT_TOOLS)
        "${clean[@]}" node "$GITHUB_ACTION_PATH/../../../bin/no-bloat.mjs" --verify-install "$PWD/node_modules/@dustinedwards/devkit"
        "${clean[@]}" node "$bin" --config "$CONFIG" ${LINES_FROM:+--lines-from "$LINES_FROM"}
