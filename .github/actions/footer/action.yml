name: footer
description: >-
  Removes the "Generated by Claude Code" footer from the pull request description (scripts/strip-pr-footer.mjs); on a
  dispatch, from every pull request. Needs pull-requests write, and only the repository's own branches: a fork's token
  cannot write the description. One copy for checks.yml and pr.yml.

runs:
  using: composite
  steps:
    - name: No Claude Code footer on the description
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/strip-pr-footer.mjs"
