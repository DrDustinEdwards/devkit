name: code-map

# The caller a public repository keeps. Replace the sha with the commit of devkit that holds the reviewed code-map.yml, and
# keep it a full sha: scripts/check-callers.mjs fails on anything else. It runs after a push to the default branch, so it is
# never a gate on a pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-map:
    # A called workflow holds no more than this job grants: the write lets it push code-map.json to the code-map branch.
    permissions:
      contents: write
    uses: DrDustinEdwards/devkit/.github/workflows/code-map.yml@0000000000000000000000000000000000000000
    with:
      coverage-command: npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=json --coverage.include=src/**
