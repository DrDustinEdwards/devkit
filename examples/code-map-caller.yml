name: code-map

# The caller a public repository keeps. Replace the sha with the commit of devkit that holds the reviewed code-map.yml, and
# keep it a full sha: scripts/check-callers.mjs fails on anything else. It is never a gate on a pull request.
#
# NIGHTLY, NOT ON EVERY PUSH (2026-11-06): a push to main ran it once per merge, a runner each, while the account's 20
# runners were the bottleneck (README, "No second run on main"). The explorer reads the newest map, which is then at most
# a day behind. Monday's run (its own cron line) and a manual one also run Stryker; the other nights reuse its numbers.

on:
  schedule:
    - cron: "17 4 * * 0,2-6"
    - cron: "17 4 * * 1"
  workflow_dispatch:

# One run at a time, so a nightly map never overwrites the weekly mutation run while it is still going.
concurrency:
  group: code-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  code-map:
    # A called workflow holds no more than this job grants: the write lets it push code-map.json to the code-map branch.
    permissions:
      contents: write
    uses: DrDustinEdwards/devkit/.github/workflows/code-map.yml@0000000000000000000000000000000000000000
    with:
      coverage-command: npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=json --coverage.include=src/**
      mutation-command: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1') && 'npx stryker run' || '' }}
      mutation-file: reports/mutation/*.json
      timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1') && 120 || 20 }}
