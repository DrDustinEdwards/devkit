name: deploy

# The caller a Worker repository keeps. Replace the sha with the commit of devkit that holds the reviewed worker-deploy.yml,
# and keep it a full sha: scripts/check-callers.mjs fails on anything else. The commit's release tag goes in the comment.
#
# The repository's own checks stay its own job; the deploy needs them, so a failing test never reaches production.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy in flight: a newer push waits for the older one's deploy and live gate to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test

  ship:
    needs: checks
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@0000000000000000000000000000000000000000 # v0.6.0
    with:
      worker-name: sample
      health-url: https://sample.example.com/health
      verify-command: node scripts/verify-live.mjs
      # The repository's own guards before a deploy; omit for none.
      pre-deploy: npm run build && node scripts/check-migrations.mjs
      # The Worker reads env.DEPLOY_SHA and /health reports it as `sha`.
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
