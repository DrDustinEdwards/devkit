name: restore-drill

# The caller a repository with a D1 database keeps. Replace the sha with the commit of devkit that holds the reviewed
# restore-drill.yml, and keep it a full sha: scripts/check-callers.mjs fails on anything else. The commit's release tag goes
# in the comment. d1-dump-ref is the d1-dump release the drill runs.
#
# The token reads the backups bucket only (R2: Read), so the drill can download a dump and change nothing.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@0000000000000000000000000000000000000000 # v0.20.0
    with:
      bucket: sample-backups
      d1-dump-ref: v0.7.0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
