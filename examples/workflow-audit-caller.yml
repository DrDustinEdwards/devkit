name: workflow-audit

# The caller a repository keeps. Replace the sha with the devkit commit that holds the reviewed workflow-audit.yml, and keep
# it a full sha: scripts/check-callers.mjs fails on anything else. Exceptions go in .github/actionlint.yaml and
# .github/zizmor.yml, each with its reason.
#
# SUPERSEDED for pull requests by examples/pr-caller.yml, which runs this check with the others in one job; keep this
# file only until the repository moves (README, "One job per pull request").

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-audit:
    uses: DrDustinEdwards/devkit/.github/workflows/workflow-audit.yml@0000000000000000000000000000000000000000
