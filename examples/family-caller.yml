name: family

# The caller a repository keeps. Replace the sha with the commit of devkit that holds the reviewed family.yml, and keep it
# a full sha: scripts/check-callers.mjs fails on anything else. Exceptions go in .family.json at the repository root, each
# with its reason. What the shared packages export: https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: family-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  family:
    uses: DrDustinEdwards/devkit/.github/workflows/family.yml@0000000000000000000000000000000000000000
