name: review

# The caller a repository keeps: devkit's review.yml asks Capsid to review each pull request and writes the verdict to a
# "review verdict" check (advisory: never failed). Replace the sha with the commit of devkit that holds the reviewed
# review.yml, and keep it a full sha: scripts/check-callers.mjs fails on anything else. No secret is passed: Capsid is
# reached with the job's OIDC token.
#
# SUPERSEDED for pull requests by examples/pr-caller.yml, which runs this check with the others in one job; keep this
# file only until the repository moves (README, "One job per pull request").

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

# A newer push cancels the review of the older one.
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # A called workflow holds no more than this job grants.
    permissions:
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/review.yml@0000000000000000000000000000000000000000
