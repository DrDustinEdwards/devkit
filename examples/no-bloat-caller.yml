name: no-bloat

# The caller a repository keeps. Replace the sha with the commit of devkit that holds the reviewed no-bloat.yml, and keep it
# a full sha: scripts/check-callers.mjs fails on anything else. The repository also lists "@dustinedwards/devkit" in its
# devDependencies at a tag, and keeps its runs and baseline in .no-bloat.json (`npx devkit-no-bloat --write-baseline`).
#
# SUPERSEDED for pull requests by examples/pr-caller.yml, which runs this check with the others in one job; keep this
# file only until the repository moves (README, "One job per pull request").

on:
  # A public repository: every pull request (pr.yml once it moves). No push to the default branch: the merge was checked
  # as a pull request (README, "No second run on main").
  pull_request:
  # A private repository spends minutes: drop the one above and run weekly instead, which it keeps beside pr.yml.
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@0000000000000000000000000000000000000000
    with:
      # Generated files the code imports, if any; omit otherwise.
      prepare: npm run build:content
