name: checks

# The caller a repository keeps: devkit's checks.yml runs the footer strip, the trailer check and the shared-code check in
# one job. Replace the sha with the commit of devkit that holds the reviewed checks.yml, and keep it a full sha:
# scripts/check-callers.mjs fails on anything else. The default branch here is main; use the repository's own. Run it by
# hand once to clean the footer from every past pull request. Exceptions to the shared-code check go in .shared.json.
#
# SUPERSEDED for pull requests by examples/pr-caller.yml, which runs this check with the others in one job; keep this
# file only until the repository moves (README, "One job per pull request").

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# No push to the default branch: the merge was checked as a pull request (README, "No second run on main"). A newer push
# to a pull request cancels its older run. An edit of the description has a group of its own, so it never cancels a run
# that is checking the code.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.action == 'edited') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A called workflow holds no more than this job grants, contents: read included, which the shared file declares.
    permissions:
      contents: read
      pull-requests: write
    uses: DrDustinEdwards/devkit/.github/workflows/checks.yml@0000000000000000000000000000000000000000
